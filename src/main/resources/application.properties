spring.application.name=HaggleAI

# Load a git-ignored .env file (KEY=value lines) from the project root, if present.
# Keeps every secret out of the repo and out of your IDE run configs.
spring.config.import=optional:file:.env[.properties]

# ---- AI providers ----
# Placeholders keep the app booting with no keys. Put real values in git-ignored .env:
#   OPENAI_API_KEY=sk-...
#   WATSONX_API_KEY=...
#   WATSONX_PROJECT_ID=...
# Agents auto-upgrade: OpenAI → clinic/negotiator LLMs; watsonx → spoken summary.
# Without keys, deterministic fallbacks run (demo still works).
spring.ai.openai.api-key=${OPENAI_API_KEY:placeholder}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.elevenlabs.api-key=${ELEVENLABS_API_KEY:placeholder}

haggle.ai.use-llm=${USE_LLM:true}
haggle.watsonx.api-key=${WATSONX_API_KEY:}
haggle.watsonx.project-id=${WATSONX_PROJECT_ID:}
haggle.watsonx.url=${WATSONX_URL:https://us-south.ml.cloud.ibm.com}
haggle.watsonx.model-id=${WATSONX_MODEL_ID:ibm/granite-3-8b-instruct}

# ---- Persistence ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/haggleai}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# ---- Telephony ----
# Public base URL Twilio calls back into. ngrok static domain in dev,
# deployed host for the demo. Must be reachable from the internet.
haggle.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}

# ---- Run budget ----
# The deadline is enforced in code, not hoped for. When it expires, whatever
# quotes exist ARE the answer — the caller hears partial results, never an error.
# 25s was tuned on a warm laptop. On shared/throttled hosting the same run
# blows through it and every clinic reports "held firm" — a report showing the
# product doing nothing. The deadline still binds; it just has real headroom.
haggle.run.deadline-seconds=${RUN_DEADLINE_SECONDS:60}
haggle.run.clinic-count=${CLINIC_COUNT:5}
haggle.run.max-rounds=${MAX_ROUNDS:3}

# ---- CORS ----
haggle.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ---- Error responses ----
# Never return Java stack traces to API clients. They leak internal structure
# and dependency versions, and they're what a bad-request response should not
# look like in a demo someone is reading over your shoulder.
server.error.include-stacktrace=never
server.error.include-message=always
