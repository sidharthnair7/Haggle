# This file is loaded by ClinicConfigService. Swap the file, swap the market —
# the agents, gate and orchestrator never learn what vertical they're in.
#
# floor          the lowest total this clinic will EVER accept. Hidden from the
#                negotiator, enforced in code on submit_quote, never in a prompt
#                alone. An LLM told "don't go below X" will eventually go below X.
# openingTotal   what they quote first, before any pressure
# persona        shapes how the agent talks and whether it itemizes up front
# concessionRate how much of the gap to a cited competing quote they'll close
clinics:
