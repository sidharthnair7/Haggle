<svg viewBox="0 0 1040 760" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="760" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="34" font-size="17" font-weight="700" fill="#111827">Haggle — request flow</text>
  <text x="30" y="54" font-size="12.5" fill="#6b7280">POST /api/runs to a ranked, itemized result. Solid arrows are the happy path. Red arrows are refusals.</text>

  <!-- ============ Client ============ -->
  <rect x="30" y="80" width="180" height="56" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="120" y="103" font-size="13" font-weight="700" text-anchor="middle" fill="#3730a3">React client</text>
  <text x="120" y="120" font-size="11" text-anchor="middle" fill="#4338ca">Workspace.jsx · SSE</text>

  <!-- RunController -->
  <rect x="270" y="80" width="200" height="56" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="370" y="103" font-size="13" font-weight="700" text-anchor="middle" fill="#111827">RunController</text>
  <text x="370" y="120" font-size="11" text-anchor="middle" fill="#4b5563">POST /api/runs</text>

  <line x1="210" y1="108" x2="266" y2="108" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RunService -->
  <rect x="530" y="80" width="220" height="56" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="640" y="103" font-size="13" font-weight="700" text-anchor="middle" fill="#111827">RunService.start()</text>
  <text x="640" y="120" font-size="11" text-anchor="middle" fill="#4b5563">spawns a virtual thread, returns instantly</text>

  <line x1="470" y1="108" x2="526" y2="108" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Orchestrator -->
  <rect x="290" y="176" width="460" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="520" y="200" font-size="13.5" font-weight="700" text-anchor="middle" fill="#713f12">NegotiationOrchestrator.execute(runId)</text>
  <text x="520" y="219" font-size="11" text-anchor="middle" fill="#854d0e">runs async · deadline enforced in code, never hoped for</text>

  <line x1="640" y1="136" x2="580" y2="172" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Three phase boxes -->
  <rect x="60" y="272" width="290" height="150" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="205" y="296" font-size="13" font-weight="700" text-anchor="middle" fill="#065f46">1 · shopRound1</text>
  <text x="80" y="318" font-size="11" fill="#065f46">runInParallel(5 clinics)</text>
  <text x="80" y="335" font-size="11" fill="#065f46">each clinic on its own</text>
  <text x="80" y="350" font-size="11" fill="#065f46">virtual thread</text>
  <text x="80" y="372" font-size="11" fill="#065f46">invokeAll() blocks until</text>
  <text x="80" y="387" font-size="11" fill="#065f46">all five return — the barrier</text>
  <text x="80" y="408" font-size="10.5" font-style="italic" fill="#047857">→ opening quotes captured</text>

  <rect x="375" y="272" width="290" height="150" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="520" y="296" font-size="13" font-weight="700" text-anchor="middle" fill="#831843">2 · itemizeBundled</text>
  <text x="395" y="318" font-size="11" fill="#831843">for every clinic that gave a</text>
  <text x="395" y="333" font-size="11" fill="#831843">bundled headline instead of</text>
  <text x="395" y="348" font-size="11" fill="#831843">a real breakdown</text>
  <text x="395" y="370" font-size="11" fill="#831843">presses for the itemized</text>
  <text x="395" y="385" font-size="11" fill="#831843">total, fees included</text>
  <text x="395" y="408" font-size="10.5" font-style="italic" fill="#9d174d">→ this is the $380 → $575 reveal</text>

  <rect x="690" y="272" width="290" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="835" y="296" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">3 · negotiateRounds</text>
  <text x="710" y="318" font-size="11" fill="#1e3a8a">up to 3 rounds, same barrier</text>
  <text x="710" y="333" font-size="11" fill="#1e3a8a">pattern as step 1</text>
  <text x="710" y="355" font-size="11" fill="#1e3a8a">each clinic is offered the</text>
  <text x="710" y="370" font-size="11" fill="#1e3a8a">cheapest competing quote</text>
  <text x="710" y="385" font-size="11" fill="#1e3a8a">as leverage</text>
  <text x="710" y="408" font-size="10.5" font-style="italic" fill="#1d4ed8">→ stops early once nobody moves</text>

  <line x1="205" y1="236" x2="205" y2="268" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="347" x2="371" y2="347" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="665" y1="347" x2="686" y2="347" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- LeverageGate, sitting below step 3, fed by it -->
  <rect x="710" y="460" width="250" height="86" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="835" y="484" font-size="13" font-weight="700" text-anchor="middle" fill="#7f1d1d">LeverageGate.verify()</text>
  <text x="730" y="504" font-size="10.5" fill="#7f1d1d">checks the cited figure against a</text>
  <text x="730" y="519" font-size="10.5" fill="#7f1d1d">provenance store of quotes actually</text>
  <text x="730" y="534" font-size="10.5" fill="#7f1d1d">captured on this run. No prompt involved.</text>

  <line x1="835" y1="422" x2="835" y2="456" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="845" y="443" font-size="10" fill="#dc2626">every citeAmount</text>

  <!-- gate outcomes -->
  <rect x="580" y="580" width="200" height="52" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="680" y="602" font-size="11.5" font-weight="700" text-anchor="middle" fill="#065f46">match found</text>
  <text x="680" y="618" font-size="10" text-anchor="middle" fill="#047857">citation allowed, price moves</text>

  <rect x="800" y="580" width="200" height="52" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="900" y="602" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7f1d1d">no match</text>
  <text x="900" y="618" font-size="10" text-anchor="middle" fill="#991b1b">blocked, written to transcript</text>

  <line x1="790" y1="546" x2="695" y2="576" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="870" y1="546" x2="890" y2="576" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Persistence + SSE, spanning the bottom -->
  <rect x="60" y="480" width="590" height="66" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="80" y="503" font-size="12" font-weight="700" fill="#374151">every step writes through:</text>
  <text x="80" y="522" font-size="11" fill="#4b5563">Quote · ConversationTurn · NegotiationEvent   (Postgres, per-thread EntityManager)</text>
  <text x="80" y="537" font-size="10" font-style="italic" fill="#6b7280">events ordered by id, not timestamp — concurrent writers share a millisecond</text>

  <!-- SSE back to client -->
  <path d="M 60 513 C -40 513, -40 108, 26 108" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="-30" y="330" font-size="10.5" fill="#4338ca" transform="rotate(-90 -30 330)" text-anchor="middle">GET /api/runs/{id}/events (SSE)</text>

  <!-- Result -->
  <rect x="330" y="670" width="380" height="58" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="520" y="694" font-size="13" font-weight="700" text-anchor="middle" fill="#3730a3">Ranked, itemized result</text>
  <text x="520" y="712" font-size="10.5" text-anchor="middle" fill="#4338ca">best price surfaced, every figure traceable to a real quote</text>

  <line x1="680" y1="632" x2="580" y2="666" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="632" x2="900" y2="650" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="900" y1="650" x2="710" y2="695" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="30" y="752" font-size="10.5" fill="#9ca3af">Full trace: NegotiationOrchestrator.execute() → shopRound1() → itemizeBundled() → negotiateRounds() → LeverageGate.verify()</text>
</svg>
